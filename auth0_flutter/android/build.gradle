buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.4.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id("org.jetbrains.kotlinx.kover") version "0.7.4"
}

apply plugin: 'com.android.library'

// AGP 9+ compiles Kotlin itself (built-in Kotlin) unless the host app opts out
// with android.builtInKotlin=false, and it fails the build when the Kotlin
// Gradle Plugin is applied on top of that. Apply KGP only where AGP will not
// compile Kotlin for us. pluginManager is used instead of `apply plugin:` on
// purpose: Flutter detects KGP usage by regex-scanning this script and would
// otherwise warn about it even on AGP 9, where this branch never runs.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    pluginManager.apply('kotlin-android')
}

def libApplicationId = 'com.auth0.auth0_flutter'

group libApplicationId
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdk 34

    if (project.android.hasProperty("namespace")) {
        namespace libApplicationId
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        test.resources.srcDirs += 'src/test/resources'
    }

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [auth0Domain: "test-domain", auth0Scheme: "test"]
    }

    buildTypes {
       debug {
           testCoverageEnabled true
       }
   }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// kotlinOptions is KGP DSL and does not exist with built-in Kotlin, where AGP
// derives the JVM target from compileOptions.targetCompatibility above.
plugins.withId("org.jetbrains.kotlin.android") {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.auth0.android:auth0:3.21.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:java-hamcrest:2.0.0.0'
    testImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"
    testImplementation "org.mockito:mockito-inline:4.11.0"
    testImplementation 'com.jayway.awaitility:awaitility:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    testImplementation 'com.auth0:java-jwt:3.19.1'

}